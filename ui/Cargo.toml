# 専用の画面（段階 13、D-062）。Leptos の CSR を WebAssembly にして、エンジンの exe に埋め込む（ui/build.ps1）。
# エンジンとは別の作業空間にする（エンジンの依存は serde_json だけのまま。D-011）。
[package]
name = "netdbg-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "ui"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# wasm-bindgen の CLI (ui/build.ps1) と同じ版にそろえる。
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Request", "RequestInit", "Headers", "Response", "Window", "Location", "UrlSearchParams", "Element", "HtmlElement", "HtmlDivElement", "KeyboardEvent", "MouseEvent", "Event", "Storage", "Document"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"