[package]
name = "netdbg"
version = "0.9.1"
edition = "2021"
description = "Debug engine for .NET and .NET Framework processes (x86 first, x64 too) speaking DAP"
license = "MIT"
publish = false

[workspace]
members = ["tools/idlgen"]
# 専用の画面 (ui/) は wasm 向けの別の作業空間 (ui/build.ps1)。
exclude = ["ui"]

# 依存を足すときは docs/DECISIONS.md (D-011) に理由を書く。
[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
